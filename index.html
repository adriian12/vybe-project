      content="Descubre las fiestas cerca de ti, compra tu entrada y entra con el QR. Para negocios: venta de entradas, listas, aforo en directo y avisos."
    />
    <link rel="canonical" href="https://fiestea.es/" />

    <!-- Google enseña el icono si hay uno de un tamaño múltiplo de 48 px: los PNG van primero. -->

    <link rel="icon" href="/icons/icon-96.png" type="image/png" sizes="96x96" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#111114" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta property="og:site_name" content="Fiestea" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://fiestea.es/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://fiestea.es/#organization",
            "name": "Fiestea",
            "url": "https://fiestea.es/",
            "logo": "https://fiestea.es/icons/icon-512.png",
            "email": "soporte@fiestea.es",
            "areaServed": "España"
          },
          {
            "@type": "WebSite",
            "@id": "https://fiestea.es/#website",
            "url": "https://fiestea.es/",
            "name": "Fiestea",
            "inLanguage": "es-ES",
            "publisher": { "@id": "https://fiestea.es/#organization" }
          },
          {
            "@type": "MobileApplication",
            "name": "Fiestea",
            "operatingSystem": "Android, iOS",
            "applicationCategory": "LifestyleApplication",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
            "publisher": { "@id": "https://fiestea.es/#organization" }
          }
        ]
      }
    </script>
    <!-- Loader de la copa (src/components/glass-loader.tsx usa estas clases). -->
    <style>
      html { background: #111114; }
      .fl { display: inline-flex; }
      .fl-boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      .fl-glass { fill: none; stroke: #f8d000; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      /* Empieza vacía, se llena y se vacía sin parar hasta que la app está lista. */
      .fl-liquid { fill: #f8d000; transform: translateY(23px); animation: fl-fill 2.2s ease-in-out infinite; }
      @keyframes fl-fill {
        0% { transform: translateY(23px); }
        45%, 55% { transform: translateY(0); }
        100% { transform: translateY(23px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .fl-liquid { animation-duration: 4s; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="fl fl-boot" role="status" aria-label="Cargando"><svg width="48" height="56" viewBox="0 0 48 56" aria-hidden="true"><defs><clipPath id="fl-bowl-boot"><path d="M6 6H42L24 28Z"/></clipPath></defs><g clip-path="url(#fl-bowl-boot)"><rect class="fl-liquid" x="0" y="6" width="48" height="23"/></g><path class="fl-glass" d="M6 6H42L24 28ZM24 28V49M15 50H33"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
