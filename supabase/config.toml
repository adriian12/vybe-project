[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/auth/verify-email"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.external.apple]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[auth.external.facebook]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[analytics]
enabled = false
port = 54327
vector_port = 54328
backend = "postgres"

# No existe una seccion [functions] global: el CLI solo admite una por funcion.
# Todas exigen JWT salvo el webhook de Stripe, que se autentica con su firma.
[functions.send-sms-verification]
verify_jwt = true

[functions.moderate-photo]
verify_jwt = true

[functions.send-sos-alert]
verify_jwt = true

[functions.stripe-checkout]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.venue-add-member]
verify_jwt = true

# Stripe no envía JWT: la autenticidad la da la cabecera Stripe-Signature.
[functions.stripe-webhook]
verify_jwt = false

# La llama un Database Webhook de Supabase con el secreto x-push-secret.
[functions.send-push]
verify_jwt = false

# Acepta eventos con y sin sesión.
[functions.analytics-collect]
verify_jwt = false

# La llama pg_cron cada pocos minutos con el secreto x-push-secret; no hay
# sesión de nadie detrás.
[functions.notify-events]
verify_jwt = false

# El alta ocurre antes de que exista sesion, asi que no puede exigir JWT. Se
# protege con limite por correo y por IP (consume_anon_rate_limit).
[functions.auth-email]
verify_jwt = false

# Lo llama Resend, que no manda JWT: la autenticidad la da la firma de Svix.
[functions.resend-webhook]
verify_jwt = false

# Formulario público de la landing: quien lo envía aún no tiene cuenta.
[functions.venue-lead]
verify_jwt = false
