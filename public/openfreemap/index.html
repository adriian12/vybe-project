<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Fiestea · Prueba de mapa</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* Página de prueba: el mapa de Fiestea con OpenFreeMap en vez de CARTO.
     No forma parte de la app; se borra cuando se decida. */
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0e0e11; color: #e4e1e6;
    font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  #mapa { position: fixed; inset: 0; }
  .barra { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 2;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
  .caja { pointer-events: auto; background: rgba(14, 14, 17, .9); border: 1px solid #2a2a30;
    border-radius: 14px; padding: 8px 12px; backdrop-filter: blur(8px); }
  .titulo b { color: #f8d000; }
  .titulo small { display: block; color: #9a97a0; font-size: 12px; }
  .estilos { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; }
  .estilos button { border: 0; border-radius: 999px; padding: 6px 12px; background: #1d1d22; color: #e4e1e6;
    font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .estilos button[aria-pressed="true"] { background: #f8d000; color: #111114; }
  .ciudades { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; }
  .ciudades button { border: 1px solid #2a2a30; border-radius: 999px; padding: 4px 10px; background: transparent;
    color: #c9c6cf; font: 500 12px system-ui, sans-serif; cursor: pointer; }

  /* Alfileres: los mismos que la app (src/index.css, .vybe-pin-*). */
  .pin { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .pin-dot { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px;
    border-radius: 999px; background: #f8d000; box-shadow: 0 6px 14px rgba(0, 0, 0, .6); }
  .pin::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #f8d000; }
  .pin.hot .pin-dot { background: #ff6a2b; box-shadow: 0 0 0 2px rgba(255, 106, 43, .35), 0 6px 14px rgba(0, 0, 0, .6); }
  .pin.hot::after { border-top-color: #ff6a2b; }
  .pin-fire { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); z-index: 1;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .6)); }

  .maplibregl-popup-content { background: #131316; color: #e4e1e6; border-radius: 14px; padding: 10px 14px;
    box-shadow: 0 0 0 1px #2a2a30, 0 20px 25px rgba(0, 0, 0, .5); }
  .maplibregl-popup-tip { border-top-color: #131316 !important; border-bottom-color: #131316 !important; }
  .maplibregl-popup-close-button { color: #9a97a0; font-size: 18px; }
  .pop b { display: block; color: #ffefbc; font-size: 14px; margin-right: 14px; }
  .pop span { color: #9a97a0; font-size: 12px; }
  .pop a { display: inline-block; margin-top: 6px; color: #f8d000; font-weight: 600; font-size: 12px; text-decoration: none; }
  .maplibregl-ctrl-attrib { background: rgba(14, 14, 17, .75) !important; color: #9a97a0; }
  .maplibregl-ctrl-attrib a { color: #c9c6cf; }
</style>
</head>
<body>
<div id="mapa"></div>
<div class="barra">
  <div class="caja titulo"><b>Fiestea</b> · prueba de mapa<small id="cuenta">Cargando fiestas…</small></div>
  <div class="caja estilos" role="group" aria-label="Estilo del mapa">
    <button data-estilo="dark" aria-pressed="true">OpenFreeMap oscuro</button>
    <button data-estilo="fiord">OpenFreeMap azul</button>
    <button data-estilo="positron">OpenFreeMap claro</button>
    <button data-estilo="carto">CARTO (el de ahora)</button>
  </div>
  <div class="caja ciudades" id="ciudades"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
  const NOTA = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111114" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
  const FUEGO = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#FF6A2B" stroke="#111114" stroke-width="1.6" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>';

  // La clave de basemaps de CARTO ya es pública (va en el bundle de la app);
  // sólo está para comparar con el mapa de ahora.
  const CARTO_KEY = 'cb1_3ojw_1_4e25963353432396cdd7b2aa';
  const ATRIB_CARTO = '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>';
  const estilo = (nombre) => nombre === 'carto'
    ? { version: 8, sources: { carto: { type: 'raster', tileSize: 256, attribution: ATRIB_CARTO,
          tiles: ['a', 'b', 'c', 'd'].map((s) => `https://${s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png?key=${CARTO_KEY}`) } },
        layers: [{ id: 'carto', type: 'raster', source: 'carto' }] }
    : `https://tiles.openfreemap.org/styles/${nombre}`;

  const mapa = new maplibregl.Map({
    container: 'mapa', style: estilo('dark'), center: [-3.7, 40.2], zoom: 5.2,
    attributionControl: { compact: true },
  });
  mapa.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

  document.querySelectorAll('[data-estilo]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-estilo]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    mapa.setStyle(estilo(b.dataset.estilo));
  }));

  const escapar = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fecha = new Intl.DateTimeFormat('es-ES', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid' });

  fetch('/openfreemap/fiestas.json').then((r) => r.json()).then((fiestas) => {
    const ahora = Date.now();
    fiestas = fiestas.filter((f) => new Date(f.f).getTime() > ahora);
    const porCiudad = {};
    for (const f of fiestas) {
      (porCiudad[f.c || 'Otras'] ??= []).push(f);
      const el = document.createElement('div');
      el.className = 'pin' + (f.d ? ' hot' : '');
      el.innerHTML = (f.d ? `<span class="pin-fire">${FUEGO}</span>` : '') + `<span class="pin-dot">${NOTA}</span>`;
      new maplibregl.Marker({ element: el, anchor: 'bottom', offset: [0, -6] })
        .setLngLat([f.lo, f.la])
        .setPopup(new maplibregl.Popup({ offset: 40, maxWidth: '240px' }).setHTML(
          `<div class="pop"><b>${escapar(f.n)}</b><span>${escapar(f.s)} · ${escapar(f.c)}<br>${fecha.format(new Date(f.i))}</span><br>` +
          `<a href="https://app.fiestea.es/event/${encodeURIComponent(f.id)}" target="_blank" rel="noopener">Ver en Fiestea →</a></div>`))
        .addTo(mapa);
    }
    const ciudades = Object.entries(porCiudad).sort((a, b) => b[1].length - a[1].length);
    document.getElementById('cuenta').textContent = `${fiestas.length} fiestas próximas en ${ciudades.length} ciudades`;
    const caja = document.getElementById('ciudades');
    for (const [nombre, lista] of ciudades) {
      const b = document.createElement('button');
      b.textContent = `${nombre} (${lista.length})`;
      b.addEventListener('click', () => {
        const limites = new maplibregl.LngLatBounds();
        lista.forEach((f) => limites.extend([f.lo, f.la]));
        mapa.fitBounds(limites, { padding: 80, maxZoom: 14 });
      });
      caja.appendChild(b);
    }
  }).catch(() => { document.getElementById('cuenta').textContent = 'No se han podido cargar las fiestas'; });
</script>
</body>
</html>
