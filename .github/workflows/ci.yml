name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        # Sin las variables el build funciona igual; sólo verificamos que compila.
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build

      - name: Comprobar que no se cuelan scripts de terceros
        # index.html cargaba un script externo de Lovable que llegaba a
        # producción con acceso completo al DOM y a la sesión.
        run: |
          if grep -rEq "gpteng\.co|gptengineer" dist/ index.html; then
            echo "::error::Se ha detectado un script de terceros en el build"
            exit 1
          fi
          echo "Sin scripts de terceros."
